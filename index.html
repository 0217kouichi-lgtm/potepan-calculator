<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>電卓</title>
    <link rel="stylesheet" href="main.css">
    <!-- jQuery を使う場合は読み込む -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <!-- ここに表示部分とボタンを書いていきましょう -->
    <div class="calculator">

        <div class="display">0</div>
<table class="calculator-btn">
        <tr>
            <td><button class="btn num">7</button></td>
            <td><button class="btn num">8</button></td>
            <td><button class="btn num">9</button></td>
            <td><button class="btn operator">+</button></td>
        </tr>
        <tr>
            <td><button class="btn num">4</button></td>
            <td><button class="btn num">5</button></td>
            <td><button class="btn num">6</button></td>
            <td><button class="btn operator">-</button></td>
        </tr>
        <tr>
            <td><button class="btn num">1</button></td>
            <td><button class="btn num">2</button></td>
            <td><button class="btn num">3</button></td>
            <td><button class="btn operator">*</button></td>
        </tr>
        <tr>
            <td><button class="btn single-zero">0</button></td>
            <td><button class="btn double-zero">00</button></td>
            <td><button class="btn dot">.</button></td>
            <td><button class="btn operator">/</button></td>
        </tr>

        <tr>
           
            <tr>
            <td colspan="2"><button class="btn allclear">AC</button></td>
            <td colspan="2"><button class="btn equal">=</button></td>
        </tr>
        </tr>

        
    </table>

    </div>




    <script src="main.js"></script>
</body>

</html>
